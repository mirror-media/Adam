type Mutation {
  """
  This mutation will create a 'paying' magazine order in the database,
  and return the trade info fields required by Newebpay MPG API.
  """
  createNewebpayTradeInfoForMagazineOrder(data: createNewebpayTradeInfoForMagazineOrderInput!): newebpayTradeInfo

  """
  Israfel does provide `updateMembers` mutation, however, that mutation updates member records
  without optimistic concurrency control (OCC).

  Note:
  Optimistic concurrency control reference:
  https://www.prisma.io/docs/guides/performance-and-optimization/prisma-client-transactions-guide#optimistic-concurrency-control

  `updateMemberType` will only update those records whose `updatedAt` and `id` matches.
  """
  updateMemberType(targetType: memberTypeType!, where: updateMemberTypeWhereInput!): [member]

  """
  Create a newebpay payment and update its corresponding subscription which matches all the following conditions
  1. status === 'paying' || status === 'invalid'
  2. periodEndDatetime <= paymentData.paymentTime (optional: if subscription is monthly or yearly frequency)
  4. orderNumber === subsOrderNumber
  """
  createNewebpayPaymentAndUpdateSubscription(paymentData: RawNewebpayPaymentInput!): newebpayPayment

  """
  Create or update a LINEPay payment and update its corresponding subscription which matches all the following conditions
  1. linePayStatus === 'paying' || linePayStatus === 'invalid'
  2. orderId === subsOrderNumber
  """
  updateLINEPayPaymentAndSubscription(paymentData: RawLINEPayPaymentInput!): linepayPayment

  """
  This mutation adds notification event time constraint.
  It will only update the Google Play subscription if the following conditions matched:
  1. `googlePlayPurchaseToken` is in the request payload
  2. `googlePlayNotificationEventDatetime` is in the request payload and is greater than the subscription we want to update

  If `linkedPurchaseToken` is in the request payload, then this mutation will update the subscription matched `linkedPurchaseToken` to `googlePlayPurchaseToken`.
  """
  updateGooglePlaySubscriptionByNotificationEvent(data: googlePlaySubscriptionInput!): subscription

  """
  This mutation is designed for the very first time Google Play subscription purchase.
  It will create or update a Google Play subscription.
  If the database doesn't have the subscription with certain `googlePlayPurchaseToken`, and then create the subscription.
  Otherwise, update the existing subscription.

  This mutation is designed only to be used for
    - Google Play notification with `SUBSCRIPTION_PURCHASED` type
    - App receives the purchase result, and wants to verify that purchase with secured backend
  """
  createOrUpdateGooglePlaySubscription(data: googlePlaySubscriptionInput!): subscription

  """
  Update a subscription by optimistic lock.
  This mutation updatesubscription created by keystonejs does not have
  optimistic lock. Therefore, this custom mutation updateSubscriptionByOptimisticLock
  makes sure we won't update subscription mistakenly.
  """
  updateSubscriptionByOptimisticLock(data: subscriptionUpdateInput!, where: updateSubscriptionByOptimisticLockWhereInput!): subscription

  """
  Set status of (`take` number of) subscriptions with paymentMethod equals 'newebpay' from 'to_pay' to 'paying'.
  """
  setSubscriptionsStatusFromToPayToPaying(take: Int): [subscription]

  """
  Set linePayStatus of (`take` number of) subscriptions with paymentMethod equals 'line_pay' from 'to_pay' to 'paying'.
  """
  setSubscriptionsLinePayStatusFromToPayToPaying(take: Int): [subscription]

  """
  Set recurring subscriptions' status to 'to_pay' if they are matched (AND clause) the following conditions:
  1. paymentMethod === 'newebpay'
  2. frequency === 'monthly' OR frequency === 'yearly' OR frequency === 'halfyearly'
  3. status === 'fail' OR status === 'paid'
  4. isCanceled === false
  5. periodNextPayDatetime <= now
  6. related member's state is 'active'
  """
  setSubscriptionsStatusToPay: [subscription]

  """
  Set recurring subscriptions' linePayStatus to 'to_pay' if they are matched (AND clause) the following conditions:
  1. paymentMethod === 'line_pay'
  2. frequency === 'monthly' OR frequency === 'yearly' OR frequency === 'halfyearly'
  3. linePayStatus === 'fail' OR linePayStatus === 'paid'
  4. isCanceled === false
  5. periodNextPayDatetime <= now
  6. related member's state is 'active'
  """
  setSubscriptionsLinePayStatusToPay: [subscription]

  """Deactivate expired subscriptions."""
  deactivateExpiredSubscriptions: [subscription]

  """
  upsertAppStoreSubscription will upsert a subscription, and connect it to a payment if a payment is provided.

  If a payment is provided, then the following actions will proceed:
  1. It will upsert a payment and connect it to the subscription.
  2. It will update the subscription dates and isActive according to the payment if the payment's date is newer than the subscription's.
  """
  upsertAppStoreSubscription(data: upsertAppStoreSubscriptionInput!): subscription
