fragment StorySection on Section {
  id
  name
  slug
  state
}

fragment StoryCategory on Category {
  id
  name
  slug
  state
}

fragment StoryCategoryWithSection on Category {
  id
  name
  slug
  state
  isMemberOnly
  sections(where: { state: { equals: "active" } }) {
    ...StorySection
  }
}

fragment StoryContact on Contact {
  id
  name
}

fragment StoryTag on Tag {
  id
  name
  slug
}

fragment StoryAiTag on Tag {
  id
  name
  slug
}

fragment StoryHeroImage on Photo {
  imageFile {
    width
    height
  }
  resized {
    original
    w480
    w800
    w1200
    w1600
    w2400
  }
  resizedWebp {
    original
    w480
    w800
    w1200
    w1600
    w2400
  }
}

fragment StoryRelatedPostHeroImage on Photo {
  resized {
    original
    w480
    w800
  }
  resizedWebp {
    original
    w480
    w800
  }
}

fragment StoryHeroVideo on Video {
  id
  videoSrc
  heroImage {
    id
    resized {
      original
    }
  }
}

fragment StoryPartner on Partner {
  id
  slug
  name
  showOnIndex
}

fragment StoryRelatedPost on Post {
  id
  slug
  title
  heroImage {
    ...StoryRelatedPostHeroImage
  }
}

fragment StoryPost on Post {
  id
  slug
  title
  subtitle
  state
  style
  isMember
  isAdult
  publishedDate
  updatedAt
  sections(where: { state: { equals: "active" } }) {
    ...StorySection
  }
  sectionsInInputOrder {
    ...StorySection
  }
  categories(where: { state: { equals: "active" } }) {
    ...StoryCategoryWithSection
  }
  categoriesInInputOrder {
    ...StoryCategoryWithSection
  }
  writers {
    ...StoryContact
  }
  writersInInputOrder {
    ...StoryContact
  }
  photographers {
    ...StoryContact
  }
  camera_man {
    ...StoryContact
  }
  designers {
    ...StoryContact
  }
  engineers {
    ...StoryContact
  }
  vocals {
    ...StoryContact
  }
  extend_byline
  tags {
    ...StoryTag
  }
  tags_algo {
    ...StoryAiTag
  }
  auto_faq
  faqs_algo
  heroVideo {
    ...StoryHeroVideo
  }
  heroImage {
    ...StoryHeroImage
  }
  heroCaption
  brief
  relateds {
    ...StoryRelatedPost
  }
  relatedsInInputOrder {
    ...StoryRelatedPost
  }
  redirect
  og_title
  og_image {
    resized {
      w1600
    }
  }
  og_description
  hiddenAdvertised
  isAdvertised
  topics {
    slug
  }
}

fragment StoryPostFullContent on Post {
  content
}

fragment StoryExternal on External {
  id
  slug
  title
  thumb
  brief
  content
  publishedDate
  extend_byline
  thumbCaption
  partner {
    ...StoryPartner
    showThumb
    showBrief
  }
  updatedAt
  relateds {
    ...StoryRelatedPost
  }
  tags {
    ...StoryTag
  }
  tags_algo {
    ...StoryAiTag
  }
  sections(where: { state: { equals: "active" } }) {
    ...StorySection
  }
  categories(where: { state: { equals: "active" } }) {
    ...StoryCategory
  }
}

fragment StoryTopic on Topic {
  id
  slug
  name
  brief
  og_image {
    ...StoryHeroImage
  }
  heroImage {
    ...StoryHeroImage
  }
  style
  createdAt
}

query fetchStoryPostBySlug($slug: String) {
  post(where: { slug: $slug }) {
    ...StoryPost
    ...StoryPostFullContent
    relatedsOne {
      ...StoryRelatedPost
    }
    relatedsTwo {
      ...StoryRelatedPost
    }
  }
}

query fetchExternalBySlug($slug: String) {
  externals(where: { slug: { equals: $slug }, state: { equals: "published" } }) {
    ...StoryExternal
  }
}

query fetchTopics(
  $take: Int
  $skip: Int
  $orderBy: [TopicOrderByInput!]!
  $filter: TopicWhereInput!
) {
  topicsCount(where: $filter)
  topics(take: $take, skip: $skip, orderBy: $orderBy, where: $filter) {
    ...StoryTopic
  }
}
