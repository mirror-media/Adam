steps:
  # Temporarily disable kaniko cache approach due to unexpected build errors.
  #
  # build docker image for target sub-pacakge
  # use debug tag so that we can use `sh` entrypoint
  #- name: 'gcr.io/kaniko-project/executor:debug'
  #  id: Build Image
  #  entrypoint: 'sh'
  #  args:
  #    - '-c'
  #    - |
  #      /kaniko/executor --context="$(pwd)" --dockerfile=packages/$_TARGET_PACKAGE/Dockerfile --cache=true --cache-ttl=48h --destination=gcr.io/$PROJECT_ID/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA}

  - name: node:24
    id: Quality gates
    entrypoint: bash
    env:
      - HUSKY=0
      - PR_BASE_BRANCH=$_BASE_BRANCH
      - BUILD_BRANCH_NAME=$BRANCH_NAME
      - NO_NEW_JS_FALLBACK_BASE_BRANCH=$_NO_NEW_JS_BASE_BRANCH
    args:
      - '-c'
      - |
        set -euo pipefail

        corepack enable
        corepack prepare pnpm@10.17.1 --activate
        pnpm install --frozen-lockfile

        remote_name="$$(git remote | head -n 1)"
        if [[ -z "$$remote_name" ]]; then
          echo "No Git remote is available for the no-new-JS/JSX gate." >&2
          exit 2
        fi

        if [[ "$$(git rev-parse --is-shallow-repository)" == "true" ]]; then
          git fetch --no-tags --unshallow "$$remote_name"
        fi

        if [[ -n "$$PR_BASE_BRANCH" ]]; then
          base_branch="$$PR_BASE_BRANCH"
          git fetch --no-tags "$$remote_name" \
            "+refs/heads/$$base_branch:refs/remotes/$$remote_name/$$base_branch"
          no_new_js_base_ref="$$remote_name/$$base_branch"
        elif [[ "$$BUILD_BRANCH_NAME" == "$$NO_NEW_JS_FALLBACK_BASE_BRANCH" ]]; then
          no_new_js_base_ref="HEAD^"
        else
          base_branch="$$NO_NEW_JS_FALLBACK_BASE_BRANCH"
          git fetch --no-tags "$$remote_name" \
            "+refs/heads/$$base_branch:refs/remotes/$$remote_name/$$base_branch"
          no_new_js_base_ref="$$remote_name/$$base_branch"
        fi

        pnpm --dir packages/mirror-media-next lint
        pnpm typecheck
        NO_NEW_JS_BASE_REF="$$no_new_js_base_ref" pnpm check:no-new-js
        pnpm codegen:check

  # Pull previous image
  - name: gcr.io/cloud-builders/docker
    args:
      - '-c'
      - 'docker pull gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest || exit 0'
    entrypoint: bash

  # Build image
  - name: gcr.io/cloud-builders/docker
    args:
      - '-c'
      - |
        docker build -t \
        gcr.io/$PROJECT_ID/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA} \
        -t gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest \
        -f packages/$_TARGET_PACKAGE/Dockerfile \
        --build-arg NEXT_PUBLIC_IS_PREVIEW_MODE="$_IS_PREVIEW_MODE" \
        --build-arg NEXT_PUBLIC_ENV="$_NEXT_PUBLIC_ENV" \
        --build-arg ANALYZE="$_ANALYZE" \
        --cache-from gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest .
    entrypoint: bash

  # Push container image to registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA}'

  # Deploy container image to Cloud Runs
  - name: gcr.io/cloud-builders/gcloud
    id: Deploy Image
    entrypoint: 'bash'
    args:
      - '-c'
      - |

        # read cloud run service names from substitution variable
        IFS=',' read -r -a cloud_runs <<< "$_CLOUD_RUN_SERVICE_NAMES"

        for cr in "${cloud_runs[@]}"
        do

        # deploy cloud run service iteratively
        gcloud run deploy "$cr" --image gcr.io/$PROJECT_ID/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA} --region asia-east1

        done

  # Push container image to registry to update the latest one
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest'

timeout: 1800s

substitutions:
  _TARGET_PACKAGE: '' # default value
  _IMAGE_NAME: '' # default value
  _CLOUD_RUN_SERVICE_NAMES: '' # default value
  _IS_PREVIEW_MODE: 'false' # default value
  _NEXT_PUBLIC_ENV: 'dev' # default value, will be overridden by branch name normalization
  _ANALYZE: 'false' # set to 'true' to publish bundle analyzer reports under /analyze/*.html
  # Push builds compare feature branches with this target. GitHub PR triggers
  # override it with the actual `$_BASE_BRANCH`; builds on the target itself
  # compare the pushed commit with its first parent.
  _NO_NEW_JS_BASE_BRANCH: 'dev'
